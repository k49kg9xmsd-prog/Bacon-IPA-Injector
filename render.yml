# Use Render > New > Blueprint to deploy this GitHub repository.
services:
  - type: web
    name: bacon-ipa-injector-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # IMPORTANT: required for any internet-accessible file-processing endpoint.
      - key: APP_PASSWORD
        sync: false
      # Set exact GitHub Pages origin; e.g. https://YOURNAME.github.io
      # (no /repo path, no trailing slash).
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_IPA_MB
        value: '512'
      - key: MAX_UNPACKED_MB
        value: '3072'
      - key: MAX_PLUGIN_MB
        value: '32'
