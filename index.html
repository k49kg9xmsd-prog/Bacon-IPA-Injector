
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPA 插件注入</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#24292f;font:14px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
main{max-width:620px;padding:52px 20px;margin:auto}
h1{font-size:24px;margin:0 0 8px}
p{color:#6b7280;line-height:1.7;margin:0 0 28px}
.line{padding:20px 0;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
.line:last-child{border-bottom:1px solid #e5e7eb}
input{width:100%;font-size:13px}
button,.save{background:#24292f;color:white;padding:11px 23px;border:0;border-radius:5px;font:600 13px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.controls{margin-top:25px}
.save{background:white;color:#24292f;border:1px solid #aeb6c2;text-decoration:none;display:inline-block}
#status{margin:18px 0;color:#57606a;line-height:1.8;white-space:pre-wrap}
#output{margin-top:16px;padding:16px;background:#f7f8fa;border:1px solid #e0e4e9;border-radius:5px}
#filename{font-size:12px;color:#666;margin-bottom:12px;overflow-wrap:anywhere}
progress{display:block;width:100%;height:5px;margin-top:10px}
small{color:#6b7280;line-height:1.8;display:block;margin-top:35px}
[hidden]{display:none!important}
@media(max-width:480px){main{padding-top:32px}.line{display:block}.line b{display:block;margin-bottom:12px}}
</style>
</head>
<body>
<main>
<h1>IPA 插件注入</h1>
<p>選擇 IPA 和 DYLIB，在瀏覽器內直接處理，不需要額外伺服器。</p>
<div class="line"><b>IPA 檔案</b><input id="ipa" type="file" accept=".ipa"></div>
<div class="line"><b>DYLIB 插件</b><input id="dylib" type="file" accept=".dylib"></div>
<div class="controls"><button id="start" disabled>開始注入</button></div>
<div id="status">請先選擇兩個檔案。</div>
<progress id="progress" max="100" value="0" hidden></progress>
<div id="output" hidden><div id="filename"></div><a id="save" class="save" download>下載 IPA</a> <button id="share" hidden>分享</button></div>
<small>輸出為未簽名 IPA，需重新使用 KSign、ESign 等工具簽名。不支援加密 IPA；大型檔案可能耗盡 Safari 記憶體。網站使用 JSZip CDN 載入程式庫，但 IPA 和插件不會上傳至 CDN。</small>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const encoder=new TextEncoder(),decoder=new TextDecoder();
const MH64=0xFEEDFACF,FAT=0xCAFEBABE,FAT64=0xCAFEBABF,ARM64=0x100000c;
function u32(a,o,l=true){if(o<0||o+4>a.length)throw Error('Mach-O 範圍錯誤');return new DataView(a.buffer,a.byteOffset,a.byteLength).getUint32(o,l)}
function u64(a,o,l=true){if(o<0||o+8>a.length)throw Error('Mach-O 範圍錯誤');const n=Number(new DataView(a.buffer,a.byteOffset,a.byteLength).getBigUint64(o,l));if(!Number.isSafeInteger(n))throw Error('Mach-O 偏移太大');return n}
function w32(a,o,n){new DataView(a.buffer,a.byteOffset,a.byteLength).setUint32(o,n,true)}
function sliceArm64(a){
 if(a.length<32)throw Error('不是有效的 Mach-O');
 if(u32(a,0)===MH64){if(u32(a,4)!==ARM64)throw Error('不支援此 CPU 架構');return {offset:0,size:a.length}}
 const m=u32(a,0,false);if(m!==FAT&&m!==FAT64)throw Error('不是 arm64 Mach-O');
 const n=u32(a,4,false),step=m===FAT64?32:20;if(n>64||8+n*step>a.length)throw Error('Universal Mach-O 格式錯誤');
 for(let i=0;i<n;i++){const p=8+i*step,cpu=u32(a,p,false),off=m===FAT64?u64(a,p+8,false):u32(a,p+8,false),size=m===FAT64?u64(a,p+16,false):u32(a,p+12,false);
  if(cpu===ARM64){if(size<32||off+size>a.length)throw Error('arm64 區段超出檔案');return {offset:off,size}}
 }
 throw Error('找不到 arm64 區段');
}
function parse(a,s){
 const b=s.offset;if(u32(a,b)!==MH64)throw Error('Mach-O 格式錯誤');
 const type=u32(a,b+12),count=u32(a,b+16),length=u32(a,b+20);
 if(count>5000||length+32>s.size)throw Error('載入指令尺寸錯誤');
 let p=b+32,first=Infinity;const cmds=[];
 for(let i=0;i<count;i++){
  const cmd=u32(a,p),size=u32(a,p+4);
  if(size<8||size%4||p+size>b+32+length)throw Error('載入指令損毀');
  cmds.push({at:p,cmd,size});
  if(cmd===0x19){
   if(size<72)throw Error('Segment 內容錯誤');
   const n=u32(a,p+64);if(n>Math.floor((size-72)/80))throw Error('Section 表錯誤');
   for(let j=0;j<n;j++){const sec=p+72+80*j,secSize=u64(a,sec+40),off=u32(a,sec+48);
    if(off&&secSize){if(off+secSize>s.size)throw Error('Section 超出範圍');first=Math.min(first,b+off)}
   }
  }
  p+=size;
 }
 if(p!==b+32+length)throw Error('載入指令不完整');
 return {type,count,length,first,cmds};
}
function dylibLoadCommand(path){const bytes=encoder.encode(path+'\0'),size=Math.ceil((24+bytes.length)/8)*8,a=new Uint8Array(size);w32(a,0,12);w32(a,4,size);w32(a,8,24);w32(a,12,2);a.set(bytes,24);return a}
function injectExe(source,path){
 const a=new Uint8Array(source),s=sliceArm64(a),p=parse(a,s);
 if(p.type!==2)throw Error('App 主程式不是 MH_EXECUTE');
 const dylibCmds=new Set([12,0x18,0x1f,0x23,0x80000018,0x8000001f,0x80000023]);
 for(const c of p.cmds){
  if((c.cmd===0x21||c.cmd===0x2c)&&c.size>=20&&u32(a,c.at+16)!==0)throw Error('IPA 仍受 FairPlay 加密');
  if(dylibCmds.has(c.cmd)&&c.size>=24){const o=u32(a,c.at+8);if(o>=c.size)continue;let end=c.at+o;while(end<c.at+c.size&&a[end])end++;if(decoder.decode(a.subarray(c.at+o,end))===path)throw Error('插件已經注入過')}
 }
 if(p.first===Infinity)throw Error('主程式找不到 Section');
 const load=dylibLoadCommand(path),offset=s.offset+32+p.length;
 if(p.first-offset<load.length)throw Error('主程式的 Load Commands 空間不足');
 for(let i=0;i<load.length;i++)if(a[offset+i]!==0)throw Error('Load Commands 後方沒有足夠空白');
 a.set(load,offset);w32(a,s.offset+16,p.count+1);w32(a,s.offset+20,p.length+load.length);return a;
}
function validPlugin(source,name){
 const a=new Uint8Array(source),s=sliceArm64(a),p=parse(a,s);
 if(p.type!==6)throw Error('插件不是有效的 MH_DYLIB');
 const id=encoder.encode('@rpath/'+name+'\0');
 for(const c of p.cmds){if(c.cmd!==0xd||c.size<24)continue;const o=u32(a,c.at+8);if(o<24||c.size-o<id.length)break;a.fill(0,c.at+o,c.at+c.size);a.set(id,c.at+o);break}
 return a;
}
function isMachO(a){try{return a.length>32&&(u32(a,0)===MH64||[FAT,FAT64].includes(u32(a,0,false)))}catch{return false}}
async function findApp(zip){
 const keys=Object.keys(zip.files),apps=[...new Set(keys.map(n=>n.match(/^(Payload\/[^/]+\.app\/)/)?.[1]).filter(Boolean))];
 if(apps.length!==1)throw Error('IPA 必須只有一個 Payload/*.app');const prefix=apps[0];
 const inf=zip.file(prefix+'Info.plist');let exe=null;
 if(inf){const a=await inf.async('uint8array'),txt=decoder.decode(a.subarray(0,1048576)),m=txt.match(/<key>\s*CFBundleExecutable\s*<\/key>\s*<string>([^<]+)<\/string>/i);exe=m?.[1]?.trim()}
 const list=exe&&zip.file(prefix+exe)?[prefix+exe]:keys.filter(n=>n.startsWith(prefix)&&!n.endsWith('/')&&!n.slice(prefix.length).includes('/')&&!/\.(plist|mobileprovision)$/i.test(n)&&!n.endsWith('PkgInfo'));
 for(const name of list){const f=zip.file(name);if(!f)continue;const a=await f.async('uint8array');if(!isMachO(a))continue;try{const p=parse(a,sliceArm64(a));if(p.type===2)return {prefix,path:name}}catch{}}
 throw Error('找不到有效 arm64 App 執行檔');
}
let outputUrl=null,outputFile=null;
function status(s){$('status').textContent=s}
function enable(){ $('start').disabled=!($('ipa').files.length&&$('dylib').files.length) }
$('ipa').onchange=enable;$('dylib').onchange=enable;
$('start').onclick=async()=>{
 const ipa=$('ipa').files[0],plugin=$('dylib').files[0];if(!ipa||!plugin)return;
 if(typeof JSZip==='undefined'){status('JSZip 載入失敗，請檢查網路。');return}
 if(!ipa.name.toLowerCase().endsWith('.ipa')||!plugin.name.toLowerCase().endsWith('.dylib')){status('請選擇 IPA 與 DYLIB。');return}
 if(ipa.size>1536*1048576||plugin.size>64*1048576){status('IPA 超過 1.5 GB，或插件超過 64 MB。');return}
 $('start').disabled=true;$('progress').hidden=false;$('output').hidden=true;
 if(outputUrl)URL.revokeObjectURL(outputUrl);outputUrl=null;outputFile=null;
 try{
  status('讀取 IPA…');await new Promise(r=>setTimeout(r,30));
  const a=new Uint8Array(await ipa.arrayBuffer());if(a[0]!==0x50||a[1]!==0x4b)throw Error('IPA 不是有效的 ZIP 容器');
  const zip=await JSZip.loadAsync(a,{createFolders:true}),app=await findApp(zip);
  const name=plugin.name.replace(/^.*[\\/]/,'').normalize('NFKC').replace(/[^A-Za-z0-9._-]/g,'_');
  if(name.length>90||!name.toLowerCase().endsWith('.dylib')||/^\.+\.dylib$/i.test(name))throw Error('插件名稱不合法');
  const path=app.prefix+'Frameworks/'+name;
  if(zip.file(path))throw Error('IPA 中已存在同名插件');
  status('正在檢查插件…');const lib=validPlugin(await plugin.arrayBuffer(),name);
  status('正在修改 Mach-O…');const exe=zip.file(app.path),data=injectExe(await exe.async('uint8array'),'@executable_path/Frameworks/'+name);
  zip.file(app.path,data,{binary:true,unixPermissions:exe.unixPermissions||0o100755,date:exe.date,compression:'DEFLATE'});
  zip.file(path,lib,{binary:true,unixPermissions:0o100755});
  for(const n of Object.keys(zip.files))if(n.startsWith(app.prefix+'_CodeSignature/'))zip.remove(n);
  status('正在重新打包 IPA…');
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:3},platform:'UNIX',streamFiles:true,mimeType:'application/octet-stream'},m=>{$('progress').value=Math.round(m.percent)});
  const filename=ipa.name.replace(/\.ipa$/i,'')+'-Injected-Unsigned.ipa';
  outputFile=new File([blob],filename,{type:'application/octet-stream'});
  outputUrl=URL.createObjectURL(outputFile);
  $('save').href=outputUrl;$('save').download=filename;
  $('filename').textContent=filename+' · '+(blob.size/1048576).toFixed(1)+' MB';
  $('share').hidden=!(navigator.share&&(!navigator.canShare||navigator.canShare({files:[outputFile]})));
  $('output').hidden=false;status('處理完成。下載後還需要重新簽名。');
 }catch(e){console.error(e);status('注入失敗：'+(e.message||e))}
 finally{$('start').disabled=false;$('progress').hidden=true}
};
$('share').onclick=async()=>{if(!outputFile||!navigator.share)return;try{await navigator.share({files:[outputFile]})}catch(e){if(e.name!=='AbortError')status('無法分享：'+e.message)}};
window.addEventListener('pagehide',()=>{if(outputUrl)URL.revokeObjectURL(outputUrl)});
</script>
</body>
</html>
